---
name: main

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node:
          - '22'
          - '24'
    services:
      sqs:
        image: admiralpiett/goaws
        ports:
          - 4100:4100
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
