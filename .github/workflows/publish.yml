---
name: Publish
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      sqs:
        image: admiralpiett/goaws
        ports:
          - 4100:4100
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@^11
      - name: Check version
        id: version
        run: |
          echo "name=$(jq -r '.name' package.json)" >> "$GITHUB_OUTPUT"
          echo "current=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"
          echo "published=$(npm view $(jq -r '.name' package.json)@$(jq -r '.version' package.json) version 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
      - name: Publish ${{ steps.version.outputs.name }}@${{ steps.version.outputs.current }}
        if: steps.version.outputs.current != steps.version.outputs.published
        run: npm publish --access public
  github:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      sqs:
        image: admiralpiett/goaws
        ports:
          - 4100:4100
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          registry_url: https://npm.pkg.github.com
      - name: Check version
        id: version
        run: |
          echo "name=$(jq -r '.name' package.json)" >> "$GITHUB_OUTPUT"
          echo "current=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"
          echo "published=$(npm view $(jq -r '.name' package.json)@$(jq -r '.version' package.json) version 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ${{ steps.version.outputs.name }}@${{ steps.version.outputs.current }}
        if: steps.version.outputs.current != steps.version.outputs.published
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
